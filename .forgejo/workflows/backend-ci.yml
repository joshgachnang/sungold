name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".forgejo/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Backend Lint, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ github.ref }}-
            bun-${{ runner.os }}-

      # factions jobs have no Docker socket; the job image ships mongod 7.0.
      - name: Start MongoDB
        run: start-mongo-rs
        env:
          MONGO_DBPATH: /tmp/mongo

      - name: Install dependencies
        run: bun install
        working-directory: backend

      - name: Lint
        run: bun run lint
        working-directory: backend

      - name: Build
        run: bun run compile
        working-directory: backend

      - name: Test
        run: bun run test
        working-directory: backend
        env:
          CI: true
