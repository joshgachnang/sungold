name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".forgejo/workflows/frontend-ci.yml"

jobs:
  lint-and-test:
    name: Frontend Lint, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          # Per job and from frontend/'s own lockfile: the old key hashed root files that don't
          # exist, so both jobs shared one key and the backend restored the frontend's cache.
          key: bun-frontend-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'frontend/package.json') }}
          restore-keys: |
            bun-frontend-${{ runner.os }}-

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Lint
        run: bun run lint
        working-directory: frontend

      - name: TypeScript compile
        run: bun run compile
        working-directory: frontend

      - name: Test
        run: bun run test
        working-directory: frontend
        env:
          CI: true
